  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed="true"],
    [aria-selected="true"],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed="true"], [aria-selected="true"], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

        &lt;h3&gt;Proposed invariants&lt;/h3&gt;
        &lt;ul&gt;
          &lt;li&gt;Draft changes never leak into published API responses.&lt;/li&gt;
          &lt;li&gt;Publishing is atomic: consumers see either vN or vN+1.&lt;/li&gt;
          &lt;li&gt;Rejection returns the revision to an editable draft.&lt;/li&gt;
          &lt;li&gt;Withdrawal and deletion are recoverable archival actions.&lt;/li&gt;
          &lt;li&gt;All changes, submissions, approvals, and API mutations are audited.&lt;/li&gt;
          &lt;li&gt;Authorization is enforced by organization, team, capability, and resource.&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/section&gt;
      &lt;section class="guardrails"&gt;
        &lt;h3&gt;Role baseline&lt;/h3&gt;
        &lt;ul&gt;
          &lt;li&gt;&lt;strong&gt;Event manager:&lt;/strong&gt; creates and edits events within assigned teams; submits revisions.&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Super user:&lt;/strong&gt; works across the organization; reviews and approves revisions.&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Administrator:&lt;/strong&gt; manages organization settings, users, teams, event types, and credentials; reviews and approves revisions.&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Approval:&lt;/strong&gt; creation and submission never auto-approve; an administrator or super user may explicitly approve their own submitted revision.&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/section&gt;
    &lt;/div&gt;

    &lt;div class="section-heading"&gt;
      &lt;h2&gt;External API boundary&lt;/h2&gt;
      &lt;p&gt;External applications may consume production data and change participation state without gaining authority over event definitions.&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class="api-boundary"&gt;
      &lt;section class="api-zone"&gt;
        &lt;h3&gt;Allowed&lt;/h3&gt;
        &lt;p&gt;Read approved event snapshots · sign up a participant · cancel a registration or individual occurrence · retrieve registration state&lt;/p&gt;
      &lt;/section&gt;
      &lt;div class="workflow-arrow" aria-hidden="true"&gt;↔&lt;/div&gt;
      &lt;section class="api-zone"&gt;
        &lt;h3&gt;Not allowed&lt;/h3&gt;
        &lt;p&gt;Edit event definitions · bypass approval · hard-delete events · access another organization or team · read unpublished drafts&lt;/p&gt;
      &lt;/section&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class="panel" id="panel-decisions" role="tabpanel" aria-labelledby="tab-decisions" hidden&gt;
    &lt;div class="section-heading"&gt;
      &lt;h2&gt;High-impact open decisions&lt;/h2&gt;
      &lt;p&gt;These questions affect the data model, authorization boundary, and first complete workflow.&lt;/p&gt;
    &lt;/div&gt;

    &lt;ol class="decision-list"&gt;
      &lt;li class="decision"&gt;
        &lt;div&gt;&lt;h3&gt;Event-type flexibility&lt;/h3&gt;&lt;p&gt;Feature switches and typed custom fields, or fully arbitrary nested customer schemas?&lt;/p&gt;&lt;/div&gt;
        &lt;span class="viz-badge status-open"&gt;Open&lt;/span&gt;
      &lt;/li&gt;
      &lt;li class="decision"&gt;
        &lt;div&gt;&lt;h3&gt;Registration granularity&lt;/h3&gt;&lt;p&gt;Register for a whole series, selected occurrences, or both—and where do capacity and waitlists apply?&lt;/p&gt;&lt;/div&gt;
        &lt;span class="viz-badge status-open"&gt;Open&lt;/span&gt;
      &lt;/li&gt;
      &lt;li class="decision"&gt;
        &lt;div&gt;&lt;h3&gt;Bookable sessions&lt;/h3&gt;&lt;p&gt;Are sessions schedule-only, individually selectable, or configurable per event type?&lt;/p&gt;&lt;/div&gt;
        &lt;span class="viz-badge status-open"&gt;Open&lt;/span&gt;
      &lt;/li&gt;
      &lt;li class="decision"&gt;
        &lt;div&gt;&lt;h3&gt;Approval scope&lt;/h3&gt;&lt;p&gt;Approve the complete event revision initially, or support approval of individual changes?&lt;/p&gt;&lt;/div&gt;
        &lt;span class="viz-badge status-proposed"&gt;Whole revision&lt;/span&gt;
      &lt;/li&gt;
      &lt;li class="decision"&gt;
        &lt;div&gt;&lt;h3&gt;Team ownership&lt;/h3&gt;&lt;p&gt;Can an event belong to more than one team, and can managers work across assigned teams?&lt;/p&gt;&lt;/div&gt;
        &lt;span class="viz-badge status-open"&gt;Open&lt;/span&gt;
      &lt;/li&gt;
      &lt;li class="decision"&gt;
        &lt;div&gt;&lt;h3&gt;Participant identity&lt;/h3&gt;&lt;p&gt;Anonymous contacts, platform accounts, external identities, or a combination?&lt;/p&gt;&lt;/div&gt;
        &lt;span class="viz-badge status-open"&gt;Open&lt;/span&gt;
      &lt;/li&gt;
      &lt;li class="decision"&gt;
        &lt;div&gt;&lt;h3&gt;Payments&lt;/h3&gt;&lt;p&gt;Represent ticket prices and external links, or eventually collect payments, refunds, and invoices?&lt;/p&gt;&lt;/div&gt;
        &lt;span class="viz-badge status-open"&gt;Open&lt;/span&gt;
      &lt;/li&gt;
      &lt;li class="decision"&gt;
        &lt;div&gt;&lt;h3&gt;API visibility&lt;/h3&gt;&lt;p&gt;Public read endpoints for public events, scoped API credentials for all access, or both?&lt;/p&gt;&lt;/div&gt;
        &lt;span class="viz-badge status-open"&gt;Open&lt;/span&gt;
      &lt;/li&gt;
      &lt;li class="decision"&gt;
        &lt;div&gt;&lt;h3&gt;Localization&lt;/h3&gt;&lt;p&gt;Do event content, schedules, and venues need multiple languages and time zones from the start?&lt;/p&gt;&lt;/div&gt;
        &lt;span class="viz-badge status-open"&gt;Open&lt;/span&gt;
      &lt;/li&gt;
      &lt;li class="decision"&gt;
        &lt;div&gt;&lt;h3&gt;Concurrency model&lt;/h3&gt;&lt;p&gt;Real-time collaborative editing, visible edit presence, optimistic conflict detection, or locking?&lt;/p&gt;&lt;/div&gt;
        &lt;span class="viz-badge status-open"&gt;Open&lt;/span&gt;
      &lt;/li&gt;
    &lt;/ol&gt;
  &lt;/section&gt;

  &lt;section class="panel" id="panel-mvp" role="tabpanel" aria-labelledby="tab-mvp" hidden&gt;
    &lt;div class="section-heading"&gt;
      &lt;h2&gt;Initial release sequence&lt;/h2&gt;
      &lt;p&gt;Build one realistic vertical slice around a recurring event. Each phase introduces primitives that remain useful across future event types.&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class="mvp-sequence"&gt;
      &lt;section class="mvp-step"&gt;
        &lt;div class="eyebrow text-small"&gt;01 · Foundation&lt;/div&gt;
        &lt;h3&gt;Identity &amp;amp; boundaries&lt;/h3&gt;
        &lt;p&gt;Authentication, organizations, teams, roles, capabilities, authorization, and audit entries.&lt;/p&gt;
      &lt;/section&gt;
      &lt;section class="mvp-step"&gt;
        &lt;div class="eyebrow text-small"&gt;02 · Event core&lt;/div&gt;
        &lt;h3&gt;Compose a recurring event&lt;/h3&gt;
        &lt;p&gt;Event-type template, custom fields, series, occurrences, sessions, people, places, and fast list/search.&lt;/p&gt;
      &lt;/section&gt;
      &lt;section class="mvp-step"&gt;
        &lt;div class="eyebrow text-small"&gt;03 · Safe publication&lt;/div&gt;
        &lt;h3&gt;Draft, review, publish&lt;/h3&gt;
        &lt;p&gt;Revision editing, change summary, submission, approval, atomic snapshot publication, archive, and history.&lt;/p&gt;
      &lt;/section&gt;
      &lt;section class="mvp-step"&gt;
        &lt;div class="eyebrow text-small"&gt;04 · Distribution&lt;/div&gt;
        &lt;h3&gt;API &amp;amp; participation&lt;/h3&gt;
        &lt;p&gt;Scoped read API, registrations, per-occurrence cancellation, idempotent mutations, capacity, and API audit trail.&lt;/p&gt;
      &lt;/section&gt;
    &lt;/div&gt;

    &lt;section class="guardrails"&gt;
      &lt;h3&gt;Reference workflow for the vertical slice&lt;/h3&gt;
      &lt;p class="text-muted"&gt;A recurring paid course with several dates, a full session schedule, attendee registration, per-date cancellation, approval, publication, and JSON API delivery. It exercises nearly every foundational relationship without requiring every future feature.&lt;/p&gt;
    &lt;/section&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;serenity-product-map&#x27;);
      if (!root) return;

      const tabs = Array.from(root.querySelectorAll(&#x27;[role="tab"]&#x27;));
      const panels = Array.from(root.querySelectorAll(&#x27;[role="tabpanel"]&#x27;));

      const selectPanel = (name) =&gt; {
        tabs.forEach((tab) =&gt; {
          tab.setAttribute(&#x27;aria-selected&#x27;, String(tab.dataset.panel === name));
        });
        panels.forEach((panel) =&gt; {
          panel.hidden = panel.id !== `panel-${name}`;
        });
      };

      tabs.forEach((tab) =&gt; {
        tab.addEventListener(&#x27;click&#x27;, () =&gt; selectPanel(tab.dataset.panel));
      });
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src="https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js"&gt;&lt;/script&gt;
&lt;script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest("[data-tooltip]")
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener("pointerover", handlePointerOpen);
    document.removeEventListener("pointerout", handleLeave);
    document.removeEventListener("focusin", handleFocusIn);
    document.removeEventListener("focusout", handleLeave);
    document.removeEventListener("keydown", handleKeyDown);
    document.removeEventListener("contextmenu", handleContextMenu);
    tooltip = null;
  };

  document.addEventListener("pointerover", handlePointerOpen);
  document.addEventListener("pointerout", handleLeave);
  document.addEventListener("focusin", handleFocusIn);
  document.addEventListener("focusout", handleLeave);
  document.addEventListener("keydown", handleKeyDown);
  document.addEventListener("contextmenu", handleContextMenu);
  window.addEventListener("pagehide", destroy, { once: true });
})();
&lt;/script&gt;
